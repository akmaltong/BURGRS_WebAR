<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BURGRS AR - Без метки</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            object-fit: cover !important;
        }
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .burger-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px 20px;
            color: white;
            pointer-events: auto;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            pointer-events: auto;
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: #1a1a2e;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        .hidden {
            display: none !important;
        }
        .instruction {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 20px;
            pointer-events: none;
        }
        .tap-hint {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <a-scene 
            embedded 
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; facingMode: environment;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            vr-mode-ui="enabled: false"
            cursor="rayOrigin: mouse"
            raycaster="objects: .clickable">
            
            <a-assets timeout="10000">
                <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
                <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
                <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
                <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
                <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
                <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
            </a-assets>

            <!-- Освещение -->
            <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
            <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>
            <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 -1"></a-light>

            <!-- Маркер для позиционирования -->
            <a-marker 
                preset="hiro" 
                id="hiro-marker"
                emitevents="true">
                
                <a-entity 
                    id="burger-entity" 
                    position="0 0 0" 
                    scale="8 8 8"
                    rotation="0 0 0"
                    class="clickable">
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <div class="ui-overlay">
        <div class="header">
            <h1>🍔 BURGRS AR</h1>
            <p id="burger-subtitle">Наведите на Hiro-метку</p>
        </div>

        <div class="instruction" id="instruction">
            <h2>📱 Наведите на Hiro-метку</h2>
            <p style="margin-top: 15px;">Используйте стандартную Hiro-метку<br>или <a href="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" style="color: #feca57;">откройте её на экране</a></p>
        </div>

        <div class="burger-info" id="burger-info">
            <div style="text-align: center;">
                <h2 id="burger-name" style="color: #feca57; margin-bottom: 10px;">Burger</h2>
                <p id="burger-desc" style="margin-bottom: 20px;">Описание</p>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="rotateBurger()">🔄 Вращать</button>
                <button class="btn btn-secondary" onclick="scaleUp()">➕</button>
                <button class="btn btn-secondary" onclick="scaleDown()">➖</button>
                <button class="btn btn-secondary" onclick="goBack()">🏠 Назад</button>
            </div>
        </div>
    </div>

    <script>
        const burgerData = {
            'burger': { name: 'Classic Burger', model: '#burger-model', scale: '8 8 8' },
            'big-burger': { name: 'Big Burger', model: '#bigburger-model', scale: '6 6 6' },
            'zinger': { name: 'Zinger Burger', model: '#zinger-model', scale: '8 8 8' },
            'hamburger': { name: 'Hamburger', model: '#hamburger-model', scale: '8 8 8' },
            'hamburger2': { name: 'Hamburger 2', model: '#hamburger2-model', scale: '8 8 8' },
            'burger-low': { name: 'Burger Low', model: '#burgerlow-model', scale: '8 8 8' }
        };

        let currentBurger = 'burger';
        let currentScale = 8;
        let isRotating = false;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentBurger = urlParams.get('burger') || 'burger';
            
            const data = burgerData[currentBurger];
            if (data) {
                document.getElementById('burger-name').textContent = data.name;
                document.getElementById('burger-desc').textContent = data.desc || '';
                
                const entity = document.getElementById('burger-entity');
                entity.setAttribute('gltf-model', data.model);
                entity.setAttribute('scale', data.scale);
                currentScale = parseFloat(data.scale.split(' ')[0]);
            }

            const marker = document.getElementById('hiro-marker');
            marker.addEventListener('markerFound', () => {
                document.getElementById('instruction').classList.add('hidden');
                document.getElementById('burger-info').classList.remove('hidden');
            });
            marker.addEventListener('markerLost', () => {
                document.getElementById('instruction').classList.remove('hidden');
                document.getElementById('burger-info').classList.add('hidden');
            });
        }

        function rotateBurger() {
            const entity = document.getElementById('burger-entity');
            isRotating = !isRotating;
            if (isRotating) {
                entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
            } else {
                entity.removeAttribute('animation');
            }
        }

        function scaleUp() {
            const entity = document.getElementById('burger-entity');
            currentScale = Math.min(currentScale + 0.5, 15);
            entity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        }

        function scaleDown() {
            const entity = document.getElementById('burger-entity');
            currentScale = Math.max(currentScale - 0.5, 2);
            entity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        window.onload = init;
    </script>
</body>
</html>
