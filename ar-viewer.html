<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BURGRS AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .marker-info {
            background: #ff6b6b;
            color: white;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
        }
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }
        .hint h2 {
            margin-bottom: 15px;
            color: #feca57;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
        }
        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="header">
            <h1>🍔 <span id="burger-name">Burger</span></h1>
            <p id="burger-desc">Наведите на маркер</p>
            <div class="marker-info" id="marker-info">Маркер #<span id="marker-num">0</span></div>
        </div>
        <div class="hint" id="hint">
            <h2>📱 Наведите на маркер <span id="hint-marker">0</span></h2>
            <p style="margin-top: 10px;">Найдите в меню маркер с номером <span id="hint-num">0</span></p>
        </div>
        <div class="controls hidden" id="controls">
            <button class="btn" onclick="rotate()">🔄 Вращать</button>
            <button class="btn" onclick="bigger()">➕</button>
            <button class="btn" onclick="smaller()">➖</button>
            <button class="btn" onclick="back()">🏠 Назад</button>
        </div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;" 
             renderer="logarithmicDepthBuffer: true;" 
             vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
            <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
            <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
            <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
            <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
            <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>

        <!-- Маркер 0 - Classic Burger -->
        <a-marker type="pattern" url="markers/marker-0.patt" id="marker-0">
            <a-entity id="burger-0" position="0 0 0" scale="8 8 8"></a-entity>
        </a-marker>

        <!-- Маркер 1 - Big Burger -->
        <a-marker type="pattern" url="markers/marker-1.patt" id="marker-1">
            <a-entity id="burger-1" position="0 0 0" scale="6 6 6"></a-entity>
        </a-marker>

        <!-- Маркер 2 - Zinger Burger -->
        <a-marker type="pattern" url="markers/marker-2.patt" id="marker-2">
            <a-entity id="burger-2" position="0 0 0" scale="8 8 8"></a-entity>
        </a-marker>

        <!-- Маркер 3 - Hamburger -->
        <a-marker type="pattern" url="markers/marker-3.patt" id="marker-3">
            <a-entity id="burger-3" position="0 0 0" scale="8 8 8"></a-entity>
        </a-marker>

        <!-- Маркер 4 - Hamburger 2 -->
        <a-marker type="pattern" url="markers/marker-4.patt" id="marker-4">
            <a-entity id="burger-4" position="0 0 0" scale="8 8 8"></a-entity>
        </a-marker>

        <!-- Маркер 5 - Burger Low -->
        <a-marker type="pattern" url="markers/marker-5.patt" id="marker-5">
            <a-entity id="burger-5" position="0 0 0" scale="8 8 8"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const burgerData = {
            0: { name: 'Classic Burger', desc: 'Классический бургер с сочной котлетой', model: '#burger-model' },
            1: { name: 'Big Burger', desc: 'Большой бургер с двойной котлетой', model: '#bigburger-model' },
            2: { name: 'Zinger Burger', desc: 'Острый куриный бургер', model: '#zinger-model' },
            3: { name: 'Hamburger', desc: 'Традиционный гамбургер', model: '#hamburger-model' },
            4: { name: 'Hamburger 2', desc: 'Альтернативная версия гамбургера', model: '#hamburger2-model' },
            5: { name: 'Burger Low', desc: 'Легкий бургер для перекуса', model: '#burgerlow-model' }
        };

        // Получаем ID бургера из URL (0-5)
        const params = new URLSearchParams(window.location.search);
        const burgerId = parseInt(params.get('burger')) || 0;
        const data = burgerData[burgerId];

        if (data) {
            document.getElementById('burger-name').textContent = data.name;
            document.getElementById('burger-desc').textContent = data.desc;
            document.getElementById('marker-num').textContent = burgerId;
            document.getElementById('hint-marker').textContent = burgerId;
            document.getElementById('hint-num').textContent = burgerId;
            
            // Загружаем модель в соответствующий маркер
            const entity = document.getElementById(`burger-${burgerId}`);
            entity.setAttribute('gltf-model', data.model);
        }

        let rotating = false;
        let scale = 8;

        // Обработчики для маркера текущего бургера
        const currentMarker = document.getElementById(`marker-${burgerId}`);
        
        currentMarker.addEventListener('markerFound', () => {
            console.log(`✅ Маркер ${burgerId} найден!`);
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('controls').classList.remove('hidden');
        });

        currentMarker.addEventListener('markerLost', () => {
            console.log(`❌ Маркер ${burgerId} потерян`);
            document.getElementById('hint').classList.remove('hidden');
            document.getElementById('controls').classList.add('hidden');
        });

        function rotate() {
            rotating = !rotating;
            const entity = document.getElementById(`burger-${burgerId}`);
            if (rotating) {
                entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 4000');
            } else {
                entity.removeAttribute('animation');
            }
        }

        function bigger() {
            scale = Math.min(scale + 1, 12);
            document.getElementById(`burger-${burgerId}`).setAttribute('scale', `${scale} ${scale} ${scale}`);
        }

        function smaller() {
            scale = Math.max(scale - 1, 4);
            document.getElementById(`burger-${burgerId}`).setAttribute('scale', `${scale} ${scale} ${scale}`);
        }

        function back() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
