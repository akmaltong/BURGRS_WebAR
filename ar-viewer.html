<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BURGRS AR - Кастомные маркеры</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            object-fit: cover !important;
        }
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .burger-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px 20px;
            color: white;
            pointer-events: auto;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            pointer-events: auto;
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: #1a1a2e;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        .hidden {
            display: none !important;
        }
        .instruction {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 20px;
            pointer-events: none;
            max-width: 90%;
        }
        .marker-preview {
            width: 150px;
            height: 150px;
            background: white;
            margin: 20px auto;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <a-scene 
            embedded 
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; facingMode: environment;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            vr-mode-ui="enabled: false">
            
            <a-assets timeout="10000">
                <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
                <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
                <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
                <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
                <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
                <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
            </a-assets>

            <!-- Освещение -->
            <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
            <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>
            <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 -1"></a-light>

            <!-- Маркер 0 - Classic Burger -->
            <a-marker 
                type="barcode" 
                value="0"
                id="marker-0"
                emitevents="true">
                <a-entity id="burger-0" position="0 0 0" scale="8 8 8"></a-entity>
            </a-marker>

            <!-- Маркер 1 - Big Burger -->
            <a-marker 
                type="barcode" 
                value="1"
                id="marker-1"
                emitevents="true">
                <a-entity id="burger-1" position="0 0 0" scale="6 6 6"></a-entity>
            </a-marker>

            <!-- Маркер 2 - Zinger Burger -->
            <a-marker 
                type="barcode" 
                value="2"
                id="marker-2"
                emitevents="true">
                <a-entity id="burger-2" position="0 0 0" scale="8 8 8"></a-entity>
            </a-marker>

            <!-- Маркер 3 - Hamburger -->
            <a-marker 
                type="barcode" 
                value="3"
                id="marker-3"
                emitevents="true">
                <a-entity id="burger-3" position="0 0 0" scale="8 8 8"></a-entity>
            </a-marker>

            <!-- Маркер 4 - Hamburger 2 -->
            <a-marker 
                type="barcode" 
                value="4"
                id="marker-4"
                emitevents="true">
                <a-entity id="burger-4" position="0 0 0" scale="8 8 8"></a-entity>
            </a-marker>

            <!-- Маркер 5 - Burger Low -->
            <a-marker 
                type="barcode" 
                value="5"
                id="marker-5"
                emitevents="true">
                <a-entity id="burger-5" position="0 0 0" scale="8 8 8"></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <div class="ui-overlay">
        <div class="header">
            <h1>🍔 BURGRS AR</h1>
            <p id="burger-subtitle">Наведите на маркер бургера</p>
        </div>

        <div class="instruction" id="instruction">
            <h2>📱 Наведите на маркер бургера</h2>
            <p style="margin-top: 15px;">Используйте цветные маркеры с QR-меню<br>Каждый бургер имеет свой маркер!</p>
            <div class="marker-preview" id="marker-preview">
                <svg width="120" height="120" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="white"/>
                    <rect x="10" y="10" width="80" height="80" fill="none" stroke="black" stroke-width="2"/>
                    <!-- Barcode 3x3 pattern placeholder -->
                    <rect x="20" y="20" width="20" height="20" fill="black"/>
                    <rect x="60" y="20" width="20" height="20" fill="black"/>
                    <rect x="20" y="60" width="20" height="20" fill="black"/>
                    <rect x="40" y="40" width="20" height="20" fill="black"/>
                    <rect x="60" y="60" width="20" height="20" fill="black"/>
                </svg>
            </div>
            <p style="font-size: 0.9rem; color: #aaa;">Маркер должен быть напечатан<br>из меню qr-codes.html</p>
        </div>

        <div class="burger-info hidden" id="burger-info">
            <div style="text-align: center;">
                <h2 id="burger-name" style="color: #feca57; margin-bottom: 10px;">Burger</h2>
                <p id="burger-desc" style="margin-bottom: 20px;">Описание</p>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="rotateBurger()">🔄 Вращать</button>
                <button class="btn btn-secondary" onclick="scaleUp()">➕</button>
                <button class="btn btn-secondary" onclick="scaleDown()">➖</button>
                <button class="btn btn-secondary" onclick="goBack()">🏠 Назад</button>
            </div>
        </div>
    </div>

    <script>
        const burgerData = {
            0: { name: 'Classic Burger', desc: 'Классический бургер с сочной котлетой', model: '#burger-model', scale: '8 8 8' },
            1: { name: 'Big Burger', desc: 'Большой бургер с двойной котлетой', model: '#bigburger-model', scale: '6 6 6' },
            2: { name: 'Zinger Burger', desc: 'Острый куриный бургер', model: '#zinger-model', scale: '8 8 8' },
            3: { name: 'Hamburger', desc: 'Традиционный гамбургер', model: '#hamburger-model', scale: '8 8 8' },
            4: { name: 'Hamburger 2', desc: 'Альтернативная версия', model: '#hamburger2-model', scale: '8 8 8' },
            5: { name: 'Burger Low', desc: 'Легкий бургер', model: '#burgerlow-model', scale: '8 8 8' }
        };

        let currentBurger = null;
        let currentScale = 8;
        let isRotating = false;
        let activeEntity = null;

        function init() {
            // Setup all markers
            for (let i = 0; i <= 5; i++) {
                const marker = document.getElementById(`marker-${i}`);
                const entity = document.getElementById(`burger-${i}`);
                const data = burgerData[i];
                
                // Load model
                entity.setAttribute('gltf-model', data.model);
                
                marker.addEventListener('markerFound', () => {
                    currentBurger = i;
                    activeEntity = entity;
                    currentScale = parseFloat(data.scale.split(' ')[0]);
                    
                    document.getElementById('burger-name').textContent = data.name;
                    document.getElementById('burger-desc').textContent = data.desc;
                    document.getElementById('instruction').classList.add('hidden');
                    document.getElementById('burger-info').classList.remove('hidden');
                    
                    console.log(`Marker ${i} found: ${data.name}`);
                });
                
                marker.addEventListener('markerLost', () => {
                    if (currentBurger === i) {
                        document.getElementById('instruction').classList.remove('hidden');
                        document.getElementById('burger-info').classList.add('hidden');
                        currentBurger = null;
                        activeEntity = null;
                    }
                });
            }
        }

        function rotateBurger() {
            if (!activeEntity) return;
            isRotating = !isRotating;
            if (isRotating) {
                activeEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
            } else {
                activeEntity.removeAttribute('animation');
            }
        }

        function scaleUp() {
            if (!activeEntity) return;
            currentScale = Math.min(currentScale + 0.5, 15);
            activeEntity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        }

        function scaleDown() {
            if (!activeEntity) return;
            currentScale = Math.max(currentScale - 0.5, 2);
            activeEntity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        window.onload = init;
    </script>
</body>
</html>
