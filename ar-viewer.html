<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BURGRS AR Viewer</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .burger-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px 20px;
            color: white;
            pointer-events: auto;
        }
        .burger-name {
            font-size: 2rem;
            font-weight: bold;
            color: #feca57;
            margin-bottom: 10px;
        }
        .burger-desc {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: #1a1a2e;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .marker-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 20px;
            pointer-events: none;
        }
        .marker-hint h3 {
            margin-bottom: 15px;
            color: #feca57;
        }
        .marker-icon {
            width: 100px;
            height: 100px;
            border: 3px solid white;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .hidden {
            display: none !important;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .debug-info {
            position: fixed;
            top: 80px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 2000;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <h2>Загрузка AR...</h2>
        <p>Пожалуйста, разрешите доступ к камере</p>
    </div>

    <div class="debug-info" id="debug-info">
        <div>Загрузка: <span id="debug-status">Инициализация...</span></div>
        <div>Модель: <span id="debug-model">-</span></div>
        <div>Маркер: <span id="debug-marker">Не найден</span></div>
    </div>

    <div id="ar-container">
        <a-scene 
            embedded 
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            vr-mode-ui="enabled: false">
            
            <a-assets timeout="10000">
                <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
                <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
                <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
                <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
                <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
                <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
            </a-assets>

            <!-- Освещение -->
            <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
            <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>
            <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 -1"></a-light>

            <!-- Hiro Marker -->
            <a-marker 
                preset="hiro" 
                id="hiro-marker"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5">
                
                <a-entity 
                    id="burger-entity" 
                    position="0 0.1 0" 
                    scale="0.3 0.3 0.3"
                    rotation="0 0 0">
                </a-entity>
                
                <!-- Базовая плоскость для отладки -->
                <a-plane 
                    id="debug-plane"
                    position="0 0 0" 
                    rotation="-90 0 0" 
                    width="1" 
                    height="1" 
                    color="#00ff00"
                    opacity="0.3"
                    visible="false">
                </a-plane>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <div class="ui-overlay">
        <div class="header">
            <h1>🍔 BURGRS AR</h1>
            <p id="burger-subtitle">Наведите на Hiro-метку</p>
        </div>

        <div class="marker-hint" id="marker-hint">
            <div class="marker-icon">📱</div>
            <h3>Наведите камеру на Hiro-метку</h3>
            <p>Используйте печатную или экранную метку Hiro</p>
        </div>

        <div class="burger-info hidden" id="burger-info">
            <div class="burger-name" id="burger-name">Burger</div>
            <div class="burger-desc" id="burger-desc">Описание бургера</div>
            <div class="controls">
                <button class="btn btn-primary" onclick="rotateBurger()">🔄 Вращать</button>
                <button class="btn btn-secondary" onclick="scaleUp()">➕ Увеличить</button>
                <button class="btn btn-secondary" onclick="scaleDown()">➖ Уменьшить</button>
                <button class="btn btn-secondary" onclick="toggleDebug()">🔧 Отладка</button>
                <button class="btn btn-secondary" onclick="goBack()">🏠 Назад</button>
            </div>
        </div>
    </div>

    <script>
        const burgerData = {
            'burger': {
                name: 'Classic Burger',
                desc: 'Классический бургер с сочной котлетой, свежими овощами и фирменным соусом',
                model: '#burger-model',
                scale: '0.3 0.3 0.3'
            },
            'big-burger': {
                name: 'Big Burger',
                desc: 'Большой бургер с двойной котлетой для настоящих гурманов',
                model: '#bigburger-model',
                scale: '0.25 0.25 0.25'
            },
            'zinger': {
                name: 'Zinger Burger',
                desc: 'Острый куриный бургер с хрустящей корочкой и острым соусом',
                model: '#zinger-model',
                scale: '0.3 0.3 0.3'
            },
            'hamburger': {
                name: 'Hamburger',
                desc: 'Традиционный гамбургер по классическому рецепту',
                model: '#hamburger-model',
                scale: '0.3 0.3 0.3'
            },
            'hamburger2': {
                name: 'Hamburger 2',
                desc: 'Альтернативная версия гамбургера с особым вкусом',
                model: '#hamburger2-model',
                scale: '0.3 0.3 0.3'
            },
            'burger-low': {
                name: 'Burger Low',
                desc: 'Легкий бургер для перекуса',
                model: '#burgerlow-model',
                scale: '0.3 0.3 0.3'
            }
        };

        let currentBurger = 'burger';
        let currentScale = 0.3;
        let isRotating = false;
        let debugMode = false;

        function updateDebug(message) {
            console.log('[AR Debug]', message);
            document.getElementById('debug-status').textContent = message;
        }

        function init() {
            updateDebug('Инициализация...');
            
            const urlParams = new URLSearchParams(window.location.search);
            currentBurger = urlParams.get('burger') || 'burger';
            
            const data = burgerData[currentBurger];
            if (data) {
                document.getElementById('burger-name').textContent = data.name;
                document.getElementById('burger-desc').textContent = data.desc;
                document.getElementById('burger-subtitle').textContent = data.name;
                document.getElementById('debug-model').textContent = data.model;
                
                const entity = document.getElementById('burger-entity');
                
                // Проверка загрузки ассета
                const assetItem = document.querySelector(data.model);
                if (assetItem) {
                    assetItem.addEventListener('loaded', () => {
                        updateDebug('Модель загружена!');
                    });
                    assetItem.addEventListener('error', (e) => {
                        updateDebug('Ошибка загрузки модели!');
                        console.error('Asset load error:', e);
                    });
                }
                
                entity.setAttribute('gltf-model', data.model);
                entity.setAttribute('scale', data.scale);
                currentScale = parseFloat(data.scale.split(' ')[0]);
                
                updateDebug('Модель установлена: ' + data.model);
            } else {
                updateDebug('Ошибка: бургер не найден');
            }

            // Hide loading after initialization
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                updateDebug('Готово к работе');
            }, 3000);

            // Marker events
            const marker = document.getElementById('hiro-marker');
            marker.addEventListener('markerFound', () => {
                updateDebug('Маркер найден!');
                document.getElementById('debug-marker').textContent = 'Найден ✓';
                document.getElementById('marker-hint').classList.add('hidden');
                document.getElementById('burger-info').classList.remove('hidden');
                
                // Показать отладочную плоскость в режиме отладки
                if (debugMode) {
                    document.getElementById('debug-plane').setAttribute('visible', 'true');
                }
            });
            
            marker.addEventListener('markerLost', () => {
                updateDebug('Маркер потерян');
                document.getElementById('debug-marker').textContent = 'Потерян';
                document.getElementById('marker-hint').classList.remove('hidden');
                document.getElementById('burger-info').classList.add('hidden');
            });

            // Проверка поддержки камеры
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateDebug('Камера не поддерживается!');
                alert('Ваш браузер не поддерживает доступ к камере. Используйте Chrome или Safari.');
            }
        }

        function toggleDebug() {
            debugMode = !debugMode;
            const debugPlane = document.getElementById('debug-plane');
            const debugInfo = document.getElementById('debug-info');
            
            if (debugMode) {
                debugPlane.setAttribute('visible', 'true');
                debugInfo.style.display = 'block';
                updateDebug('Режим отладки включен');
            } else {
                debugPlane.setAttribute('visible', 'false');
                debugInfo.style.display = 'none';
            }
        }

        function rotateBurger() {
            const entity = document.getElementById('burger-entity');
            isRotating = !isRotating;
            if (isRotating) {
                entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear');
            } else {
                entity.removeAttribute('animation');
            }
        }

        function scaleUp() {
            const entity = document.getElementById('burger-entity');
            currentScale = Math.min(currentScale + 0.05, 1.0);
            entity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
            updateDebug('Масштаб: ' + currentScale.toFixed(2));
        }

        function scaleDown() {
            const entity = document.getElementById('burger-entity');
            currentScale = Math.max(currentScale - 0.05, 0.1);
            entity.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
            updateDebug('Масштаб: ' + currentScale.toFixed(2));
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Global error:', e);
            updateDebug('Ошибка: ' + e.message);
        });

        window.onload = init;
    </script>
</body>
</html>
