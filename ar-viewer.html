<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BURGRS AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
        }
        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="header">
            <h1>🍔 <span id="burger-name">Burger</span></h1>
            <p id="burger-desc">Наведите на Hiro маркер</p>
        </div>
        <div class="hint" id="hint">
            <h2>📱 Наведите на маркер</h2>
            <p style="margin-top: 10px;">Используйте печатный Hiro маркер</p>
        </div>
        <div class="controls hidden" id="controls">
            <button class="btn" onclick="rotate()">🔄 Вращать</button>
            <button class="btn" onclick="bigger()">➕</button>
            <button class="btn" onclick="smaller()">➖</button>
            <button class="btn" onclick="back()">🏠 Назад</button>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false">
        <a-assets>
            <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
            <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
            <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
            <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
            <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
            <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>

        <a-marker preset="hiro" id="marker">
            <a-entity id="burger" position="0 0 0" scale="5 5 5"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const data = {
            'burger': { name: 'Classic Burger', desc: 'Классический бургер', model: '#burger-model' },
            'big-burger': { name: 'Big Burger', desc: 'Большой бургер', model: '#bigburger-model' },
            'zinger': { name: 'Zinger Burger', desc: 'Острый куриный', model: '#zinger-model' },
            'hamburger': { name: 'Hamburger', desc: 'Традиционный', model: '#hamburger-model' },
            'hamburger2': { name: 'Hamburger 2', desc: 'Альтернативный', model: '#hamburger2-model' },
            'burger-low': { name: 'Burger Low', desc: 'Легкий бургер', model: '#burgerlow-model' }
        };

        const params = new URLSearchParams(window.location.search);
        const burgerId = params.get('burger') || 'burger';
        const info = data[burgerId];

        if (info) {
            document.getElementById('burger-name').textContent = info.name;
            document.getElementById('burger-desc').textContent = info.desc;
            
            const burger = document.getElementById('burger');
            burger.setAttribute('gltf-model', info.model);
        }

        let rotating = false;
        let scale = 5;

        document.getElementById('marker').addEventListener('markerFound', () => {
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('controls').classList.remove('hidden');
        });

        document.getElementById('marker').addEventListener('markerLost', () => {
            document.getElementById('hint').classList.remove('hidden');
            document.getElementById('controls').classList.add('hidden');
        });

        function rotate() {
            rotating = !rotating;
            const burger = document.getElementById('burger');
            if (rotating) {
                burger.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 4000');
            } else {
                burger.removeAttribute('animation');
            }
        }

        function bigger() {
            scale = Math.min(scale + 1, 10);
            document.getElementById('burger').setAttribute('scale', `${scale} ${scale} ${scale}`);
        }

        function smaller() {
            scale = Math.max(scale - 1, 2);
            document.getElementById('burger').setAttribute('scale', `${scale} ${scale} ${scale}`);
        }

        function back() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
