<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BURGRS AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
            text-align: center;
        }
        .marker-info {
            background: #ff6b6b;
            color: white;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
        }
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
        }
        .hint h2 {
            margin-bottom: 15px;
            color: #feca57;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
        }
        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="header">
            <h1>🍔 <span id="burger-name">Burger</span></h1>
            <p id="burger-desc">Наведите на маркер</p>
            <div class="marker-info" id="marker-info">Маркер #<span id="marker-num">0</span></div>
        </div>
        <div class="hint" id="hint">
            <h2>📱 Наведите на маркер <span id="hint-marker">0</span></h2>
            <p style="margin-top: 10px;">Найдите в меню маркер с номером <span id="hint-num">0</span></p>
        </div>
        <div class="controls hidden" id="controls">
            <button class="btn" onclick="rotate()">🔄 Вращать</button>
            <button class="btn" onclick="bigger()">➕</button>
            <button class="btn" onclick="smaller()">➖</button>
            <button class="btn" onclick="testModel()">🧪 Тест</button>
            <button class="btn" onclick="back()">🏠 Назад</button>
        </div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
             renderer="logarithmicDepthBuffer: true; antialias: true;" 
             vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="burger-model" src="Burger.glb"></a-asset-item>
            <a-asset-item id="bigburger-model" src="Big%20Burger.glb"></a-asset-item>
            <a-asset-item id="zinger-model" src="Zinger%20burger.glb"></a-asset-item>
            <a-asset-item id="hamburger-model" src="Hamburger.glb"></a-asset-item>
            <a-asset-item id="hamburger2-model" src="Hamburger2.glb"></a-asset-item>
            <a-asset-item id="burgerlow-model" src="Burger%20low.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1" position="1 2 1"></a-light>

        <!-- Hiro Marker - универсальный для всех бургеров -->
        <a-marker preset="hiro" id="marker-hiro" emitevents="true">
            <a-entity id="burger-display" position="0 0.5 0" scale="8 8 8" rotation="0 0 0"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Debug Console -->
    <div id="debug-console" style="position: fixed; top: 150px; left: 10px; right: 10px; max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.9); color: #0f0; padding: 10px; font-family: monospace; font-size: 11px; z-index: 100; border-radius: 5px; border: 2px solid #0f0;">
        <div style="font-weight: bold; margin-bottom: 5px;">🚀 AR Viewer загружен</div>
    </div>

    <script>
        // Debug logger
        function log(msg) {
            console.log(msg);
            const debugDiv = document.getElementById('debug-console');
            const entry = document.createElement('div');
            entry.textContent = `> ${msg}`;
            debugDiv.appendChild(entry);
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        const burgerData = {
            0: { name: 'Classic Burger', desc: 'Классический бургер с сочной котлетой', model: '#burger-model' },
            1: { name: 'Big Burger', desc: 'Большой бургер с двойной котлетой', model: '#bigburger-model' },
            2: { name: 'Zinger Burger', desc: 'Острый куриный бургер', model: '#zinger-model' },
            3: { name: 'Hamburger', desc: 'Традиционный гамбургер', model: '#hamburger-model' },
            4: { name: 'Hamburger 2', desc: 'Альтернативная версия гамбургера', model: '#hamburger2-model' },
            5: { name: 'Burger Low', desc: 'Легкий бургер для перекуса', model: '#burgerlow-model' }
        };

        // Получаем ID бургера из URL (0-5)
        const params = new URLSearchParams(window.location.search);
        const burgerId = parseInt(params.get('burger')) || 0;
        const data = burgerData[burgerId];

        log(`Burger ID: ${burgerId}`);

        if (data) {
            document.getElementById('burger-name').textContent = data.name;
            document.getElementById('burger-desc').textContent = data.desc;
            document.getElementById('marker-num').textContent = burgerId;
            document.getElementById('hint-marker').textContent = burgerId;
            document.getElementById('hint-num').textContent = burgerId;
            log(`Burger data loaded: ${data.name}`);
        } else {
            log(`ERROR: Burger ${burgerId} not found!`);
        }

        let rotating = false;
        let scale = 8;

        // Обработчики для маркера Hiro
        const currentMarker = document.getElementById('marker-hiro');
        
        if (currentMarker) {
            log('✅ Hiro marker element found in DOM');
            
            // Проверяем статус маркера каждую секунду
            setInterval(() => {
                const isVisible = currentMarker.object3D.visible;
                log(`👁️ Marker visible: ${isVisible}`);
            }, 3000);
            
            currentMarker.addEventListener('markerFound', (e) => {
                log('✅✅✅ MARKER FOUND EVENT!');
                log(`Marker matrix: ${JSON.stringify(e.detail.matrix)}`);
                document.getElementById('hint').classList.add('hidden');
                document.getElementById('controls').classList.remove('hidden');
                
                // Показываем сущность
                const entity = document.getElementById('burger-display');
                if (entity) {
                    entity.setAttribute('visible', 'true');
                    log('👁️ Entity set to VISIBLE');
                }
            });

            currentMarker.addEventListener('markerLost', () => {
                log('❌❌❌ MARKER LOST EVENT');
                document.getElementById('hint').classList.remove('hidden');
                document.getElementById('controls').classList.add('hidden');
            });
        } else {
            log('❌ ERROR: Hiro marker element NOT FOUND!');
        }

        // Обработка загрузки модели
        const entity = document.getElementById('burger-display');
        if (entity && data) {
            entity.addEventListener('model-loaded', (e) => {
                log(`✅ Model LOADED successfully!`);
                log(`📐 Scale: ${entity.getAttribute('scale')}`);
                log(`📍 Position: ${entity.getAttribute('position')}`);
            });
            entity.addEventListener('model-error', (e) => {
                log(`❌ Model ERROR loading: ${data.model}`);
                log(`Error details: ${JSON.stringify(e.detail)}`);
            });
            
            // Ждем загрузки сцены перед установкой модели
            setTimeout(() => {
                entity.setAttribute('gltf-model', data.model);
                log(`⏳ Setting model: ${data.model}`);
            }, 1000);
        } else {
            log(`❌ ERROR: Entity=${!!entity}, Data=${!!data}`);
        }

        function rotate() {
            rotating = !rotating;
            const entity = document.getElementById('burger-display');
            if (rotating) {
                entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 4000');
                log('🔄 Rotation ON');
            } else {
                entity.removeAttribute('animation');
                log('🔄 Rotation OFF');
            }
        }

        function bigger() {
            scale = Math.min(scale + 1, 12);
            document.getElementById('burger-display').setAttribute('scale', `${scale} ${scale} ${scale}`);
            log(`➕ Scale: ${scale}`);
        }

        function smaller() {
            scale = Math.max(scale - 1, 4);
            document.getElementById('burger-display').setAttribute('scale', `${scale} ${scale} ${scale}`);
            log(`➖ Scale: ${scale}`);
        }

        function back() {
            window.location.href = 'index.html';
        }

        // Тест модели без маркера
        function testModel() {
            log('🧪 TEST: Showing model without marker');
            const entity = document.getElementById('burger-display');
            const marker = document.getElementById('marker-hiro');
            
            if (entity && marker) {
                // Скрываем маркер и показываем модель напрямую
                entity.setAttribute('visible', 'true');
                log('✅ Model forced to visible');
                log(`📐 Current scale: ${entity.getAttribute('scale')}`);
                log(`📦 Has model: ${entity.hasAttribute('gltf-model')}`);
                log(`🔗 Model src: ${entity.getAttribute('gltf-model')}`);
            } else {
                log(`❌ Entity: ${!!entity}, Marker: ${!!marker}`);
            }
        }

        // Check scene loading
        const scene = document.querySelector('a-scene');
        scene.addEventListener('loaded', () => {
            log('✅ Scene LOADED');
            
            // Проверяем видео элемент
            setTimeout(() => {
                const video = document.querySelector('video');
                if (video) {
                    log(`📹 Video element: ${video.videoWidth}x${video.videoHeight}`);
                    log(`📹 Video playing: ${!video.paused}`);
                } else {
                    log('❌ Video element NOT FOUND');
                }
            }, 2000);
        });

        // Check AR.js ready
        window.addEventListener('arjs-video-loaded', (e) => {
            log('✅ AR Camera READY');
            log(`📹 Video stream active`);
        });

        window.addEventListener('arjs-video-error', (e) => {
            log(`❌ Camera ERROR: ${JSON.stringify(e.detail)}`);
        });

        // Asset loading checks
        document.querySelectorAll('a-asset-item').forEach(asset => {
            asset.addEventListener('loaded', () => {
                log(`✅ Asset loaded: ${asset.getAttribute('src')}`);
            });
            asset.addEventListener('error', (e) => {
                log(`❌ Asset ERROR: ${asset.getAttribute('src')}`);
            });
        });

        // Проверяем ARToolkit
        setTimeout(() => {
            if (typeof ARToolkitContext !== 'undefined') {
                log('✅ ARToolkit loaded');
            } else {
                log('❌ ARToolkit NOT loaded');
            }
        }, 3000);
    </script>
</body>
</html>
